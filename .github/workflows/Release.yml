name: Release App

on:
  push:
    branches:
      - 'master'
    tags:
      - 'v*' # Triggers the workflow only when you push a version tag like v1.0.0

jobs:
  publish-tauri:
    permissions:
      contents: write # Crucial: Allows the action to create and modify GitHub Releases
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # Apple Silicon (M1/M2/M3)
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest' # Intel Macs
            args: '--target x86_64-apple-darwin'
          - platform: 'windows-latest' # Windows x64
            args: ''
          - platform: 'ubuntu-22.04' # Linux x64 (Tauri v2 requires 22.04+)
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm' # Change to 'yarn' or 'pnpm' if you use them

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Target is required only for cross-compilation on macOS matrix blocks
          targets: ${{ matrix.platform == 'macos-latest' && format('{0}', matrix.args != '' && contains(matrix.args, 'aarch64') && 'aarch64-apple-darwin' || 'x86_64-apple-darwin') || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install system dependencies (Linux only)
        if: matrix.platform == 'ubuntu-latest' # Adjust this to match your matrix or setup
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci # Change to 'yarn install' or 'pnpm install' if needed

      - name: Strip pre-release tag for Windows MSI
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            
            // Clean tauri.conf.json
            const tauriPath = "src-tauri/tauri.conf.json";
            if (fs.existsSync(tauriPath)) {
              const config = JSON.parse(fs.readFileSync(tauriPath, "utf8"));
              if (config.version && config.version.includes("-")) {
                config.version = config.version.split("-")[0];
                fs.writeFileSync(tauriPath, JSON.stringify(config, null, 2));
                console.log("Updated tauri.conf.json version to:", config.version);
              }
            }

            // Clean package.json (if present)
            const pkgPath = "package.json";
            if (fs.existsSync(pkgPath)) {
              const pkg = JSON.parse(fs.readFileSync(pkgPath, "utf8"));
              if (pkg.version && pkg.version.includes("-")) {
                pkg.version = pkg.version.split("-")[0];
                fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2));
                console.log("Updated package.json version to:", pkg.version);
              }
            }

            // Clean Cargo.toml (if Tauri v1/v2 pulls version from there)
            const cargoPath = "src-tauri/Cargo.toml";
            if (fs.existsSync(cargoPath)) {
              let cargo = fs.readFileSync(cargoPath, "utf8");
              // Matches version = "1.0.0-beta" under [package]
              const match = cargo.match(/^version\s*=\s*"([^"]+)"/m);
              if (match && match[1].includes("-")) {
                const cleanVersion = match[1].split("-")[0];
                cargo = cargo.replace(match[0], `version = "${cleanVersion}"`);
                fs.writeFileSync(cargoPath, cargo, "utf8");
                console.log("Updated Cargo.toml version to:", cleanVersion);
              }
            }
          '

      - name: Build and Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }} # Uses the pushed tag name (e.g., v1.0.0)
          releaseName: 'App Release ${{ github.ref_name }}'
          releaseBody: 'Automated release generated by GitHub Actions.'
          releaseDraft: true # Creates a draft so you can review before making it public
          prerelease: false
          args: ${{ matrix.args }}
