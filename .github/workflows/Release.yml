name: Release App

on:
  push:
    tags:
      - 'v*' # Triggers the workflow only when you push a version tag like v1.0.0

jobs:
  publish-tauri:
    permissions:
      contents: write # Crucial: Allows the action to create and modify GitHub Releases
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # Apple Silicon (M1/M2/M3)
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest' # Intel Macs
            args: '--target x86_64-apple-darwin'
          - platform: 'windows-latest' # Windows x64
            args: ''
          - platform: 'ubuntu-22.04' # Linux x64 (Tauri v2 requires 22.04+)
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm' # Change to 'yarn' or 'pnpm' if you use them

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Target is required only for cross-compilation on macOS matrix blocks
          targets: ${{ matrix.platform == 'macos-latest' && format('{0}', matrix.args != '' && contains(matrix.args, 'aarch64') && 'aarch64-apple-darwin' || 'x86_64-apple-darwin') || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci # Change to 'yarn install' or 'pnpm install' if needed

      - name: Build and Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }} # Uses the pushed tag name (e.g., v1.0.0)
          releaseName: 'App Release ${{ github.ref_name }}'
          releaseBody: 'Automated release generated by GitHub Actions.'
          releaseDraft: true # Creates a draft so you can review before making it public
          prerelease: false
          args: ${{ matrix.args }}
